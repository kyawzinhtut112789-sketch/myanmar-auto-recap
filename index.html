<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar Auto Recap</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-top: 20px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin: 10px 0 30px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    .upload-box {
      border: 2px dashed #818cf8;
      border-radius: 15px;
      padding: 35px 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .upload-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 15px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .info {
      text-align: center;
      color: #c7d2fe;
      margin-top: 20px;
      font-size: 14px;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

      🎬 Myanmar Auto Recap
    </div>

    <div class="subtitle">
      Video တင်လိုက်ရုံနဲ့ မြန်မာလို Recap ပြုလုပ်ပေးမယ်
    </div>

    <div class="card">

      <div class="upload-box">

        <div class="upload-icon">
          🎥
        </div>

        <h2>Video Upload</h2>

        </p>

        <input
          type="file"
          id="video"
          accept="video/*"
        >

      </div>

      <label>🎙️ အသံရွေးပါ</label>

      <select id="voice">
        <option value="female">👩 မိန်းကလေးအသံ</option>
        <option value="male">👨 ယောက်ျားလေးအသံ</option>
      </select>

      <button onclick="startRecap()">
        🚀 Auto Recap စလုပ်မယ်
      </button>

      <div id="status"></div>

      <div class="info">
        မြန်မာဘာသာပြန်စာ + မြန်မာအသံ Recap
      </div>

    </div>

  </div>
